map $http_origin $cors_allowed_origin {
    default "";
    "~^https?://localhost(?::\d+)?$" $http_origin;
    "~^https?://127(?:\.\d{1,3}){3}(?::\d+)?$" $http_origin;
    "~^https?://\[::1\](?::\d+)?$" $http_origin;
    "~^https?://(?:10(?:\.\d{1,3}){3}|192\.168(?:\.\d{1,3}){2}|172\.(?:1[6-9]|2\d|3[01])(?:\.\d{1,3}){2})(?::\d+)?$" $http_origin;
    "~^https://(?:[a-z0-9-]+\.)*gomdaithanh\.com$" $http_origin;
}

server {
    listen 80;
    server_name api.gomdaithanh.com;
    root /var/www/html/public;

    index index.php;
    charset utf-8;
    client_max_body_size 128m;

    add_header Access-Control-Allow-Origin $cors_allowed_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With, X-Account-Id, X-Site-Code" always;
    add_header Access-Control-Max-Age "3600" always;
    add_header Vary "Origin" always;

    error_page 413 = @api_payload_too_large;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location @api_payload_too_large {
        default_type application/json;
        return 413 '{"message":"File upload vuot qua gioi han dung luong cua may chu.","error_code":"FILE_TOO_LARGE","detail":"Hay giam dung luong anh hoac tang client_max_body_size, upload_max_filesize va post_max_size tren moi truong deploy."}';
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

server {
    listen 80;
    server_name admin.gomdaithanh.com;
    root /var/www/html/public;

    client_max_body_size 128m;

    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /storage/ {
        access_log off;
        try_files $uri =404;
    }

    location ~ ^/index\.php$ {
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location / {
        proxy_pass http://admin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

server {
    listen 80;
    server_name gomdaithanh.com www.gomdaithanh.com;

    location / {
        proxy_pass http://website:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
