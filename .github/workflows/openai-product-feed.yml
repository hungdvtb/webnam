name: Upload OpenAI Product Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      FEED_URL: https://gomdaithanh.com/meta-feed.csv
      SFTP_HOST: sftp.commerce.openai.com
      SFTP_PORT: "443"
      SFTP_USER: oaiproductfeedprod.sftpb694da7ab2914aae8dc1354cb4959140
      SFTP_REMOTE_PATH: /gomdaithanh-products.csv.gz

    steps:
      - name: Install SFTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build OpenAI product feed
        run: |
          curl -fsSL "$FEED_URL" -o meta-feed.csv
          test -s meta-feed.csv
          node .github/scripts/build-openai-product-feed.mjs meta-feed.csv openai-product-feed.csv
          head -1 openai-product-feed.csv | grep -q '^item_id,title,description,url,brand,seller_name,image_url,availability,price'
          gzip -f openai-product-feed.csv
          wc -c openai-product-feed.csv.gz

      - name: Upload product feed to OpenAI SFTP
        env:
          SFTP_PASSWORD: ${{ secrets.OPENAI_FEED_SFTP_PASSWORD }}
        run: |
          if [ -z "$SFTP_PASSWORD" ]; then
            echo "::error::Missing repository secret OPENAI_FEED_SFTP_PASSWORD"
            exit 1
          fi

          lftp -u "$SFTP_USER","$SFTP_PASSWORD" "sftp://$SFTP_HOST:$SFTP_PORT" <<EOF
          set net:max-retries 2
          set net:timeout 30
          set sftp:auto-confirm yes
          rm -f /meta-feed.csv
          put openai-product-feed.csv.gz -o "$SFTP_REMOTE_PATH"
          cls -l "$SFTP_REMOTE_PATH"
          bye
          EOF
